<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>精肴 MERAKI</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="meraki-viewport.css" />
  </head>
  <body>
    <div class="device" role="presentation">
      <main class="splash" aria-label="精肴 MERAKI 启动页">
        <div class="splash__content">
          <div class="brand-cluster">
            <div class="logo1-block">
              <div class="heart-field" id="heart-field" aria-hidden="true"></div>
              <img
                class="logo1"
                src="images/logo1.png"
                alt="MERAKI"
                width="200"
                decoding="async"
              />
            </div>
            <img
              class="logo2"
              src="images/logo2.png"
              alt="精肴"
              width="186"
              decoding="async"
            />
          </div>
          <p class="slogan">健康美食 自己掌握</p>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
